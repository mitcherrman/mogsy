name: Launch Audience Pulse Verification

on:
  pull_request:
    paths:
      - 'src/lib/admin/analytics/**'
      - 'src/components/admin/users/**'
      - 'src/pages/admin/areas/AdminUsersPage.tsx'
      - '.github/workflows/launch-audience-pulse.yml'
permissions:
  contents: read

jobs:
  users-launch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Lockfile mismatch is documented in other Mogzy acceptance workflows.
      - name: Install dependencies without modifying lockfile
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Focused analytics and Admin tests
        run: npm test -- src/lib/admin/analytics/metrics.test.ts src/lib/admin/analytics/traffic.test.ts src/components/admin/users/AudienceSections.gameplay.test.tsx src/components/admin/users/AudiencePulse.test.tsx src/pages/admin/areas/AdminShell.areas.test.tsx
      - name: Vite production compile
        run: npx vite build
      - name: Frontend type check (existing repository baseline also fails)
        run: npx tsc --noEmit -p tsconfig.app.json
