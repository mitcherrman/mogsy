name: Mobile Recording Fit
on:
  pull_request:
    paths:
      - 'src/index.css'
      - 'e2e/mobile-recording-fit.spec.ts'
      - 'playwright.mobile-recording.config.ts'
      - '.github/workflows/mobile-recording-fit.yml'
      - 'docs/handoffs/MVFIT1-mobile-recording-fit.md'
permissions:
  contents: read
jobs:
  mobile-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install without rewriting existing stale lockfile
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Browser fit, visibility and continuity
        run: npx playwright test -c playwright.mobile-recording.config.ts
      - name: Firefox Shorts recording viewport smoke
        run: MVFIT_FIREFOX=1 npx playwright test -c playwright.mobile-recording.config.ts --grep=509x709
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-recording-fit-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Production build
        run: npx vite build
