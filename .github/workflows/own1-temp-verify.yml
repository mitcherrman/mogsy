name: OWN1 temporary verification

on:
  push:
    branches:
      - security/own1-reconcile

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Focused OWN1 tests
        run: >
          npx vitest run
          src/test/security/own1OwnerControlPlane.test.ts
          src/test/security/own1OwnerDecision.test.ts
          src/components/AdminRoute.owner.test.tsx
          src/pages/admin/AdminAcademyUpdates.route.test.tsx
          src/pages/admin/areas/AdminShell.areas.test.tsx
          src/pages/admin/knowledge/PatchOpsCard.test.tsx
