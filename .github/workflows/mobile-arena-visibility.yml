name: mobile-arena-visibility

on:
  pull_request:
    paths:
      - "src/index.css"
      - "e2e/mobile-arena-visibility.spec.ts"
      - "playwright.arena.config.ts"
      - ".github/workflows/mobile-arena-visibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install baseline dependencies without changing the stale lockfile
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phone viewport and Journey reserve acceptance
        run: npx playwright test -c playwright.arena.config.ts e2e/mobile-arena-visibility.spec.ts --workers=1
      - name: Production bundle
        run: npx vite build
