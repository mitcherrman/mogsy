name: MC-UX2 live delivery verification
on:
  push:
    branches: ["verify/mc-ux2-live-20261017"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production site and backend (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import re
          import sys
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          WEB = "https://mogzy.lol"
          API = "https://web-production-83e53.up.railway.app"
          def get(url):
              req = Request(url, headers={"User-Agent":"MogzyMCUX2LiveVerifier/1.0", "Origin":WEB})
              try:
                  with urlopen(req, timeout=25) as r:
                      return r.status, r.read()
              except HTTPError as e:
                  return e.code, e.read()

          for path, code in [("/api/health",200), ("/api/game-modes",200),
                             ("/api/game-modes/me/summary",401)]:
              status, body = get(API+path)
              print("API",path,"status",status,"bytes",len(body))
              if status != code:
                  raise AssertionError(f"Expected {code} for {path}, received {status}")

          import json
          status, body = get(API + "/api/game-modes")
          catalog = json.loads(body)
          # The public catalog is intentionally server-owned; inspect without
          # assuming which JSON wrapper is returned.
          modes = catalog.get("modes",[]) if isinstance(catalog,dict) else catalog
          if not isinstance(modes,list) or len(modes)<13:
              raise AssertionError(f"Expected 13 server-catalogued modes, found {len(modes) if isinstance(modes,list) else 'bad shape'}")
          print("Catalog modes",len(modes))

          status,html = get(WEB+"/quiz/more-challenges")
          print("Frontend HTML",status,len(html))
          if status!=200 or b"<html" not in html.lower():
              raise AssertionError("Frontend route is not serving HTML")
          ref_re=re.compile(rb'(?:/assets/|assets/|\./)[\w.+-]+\.js')
          def resolve(current, ref):
              name=ref.decode()
              return urljoin(WEB+'/',name) if name.startswith('assets/') else urljoin(current,name)
          first={resolve(WEB+"/quiz/more-challenges",x) for x in ref_re.findall(html)}
          if not first:
              raise AssertionError("No entry assets found in production HTML")
          pending=set(first); seen=set(); corpus={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              while pending and len(seen)<550:
                  batch=sorted(pending)[:40]
                  pending.difference_update(batch)
                  todo=[u for u in batch if u not in seen]
                  seen.update(todo)
                  for url,(st,body) in zip(todo,pool.map(get,todo)):
                      if st!=200:
                          raise AssertionError(f"Asset {url} returned {st}")
                      corpus[url]=body
                      for ref in ref_re.findall(body):
                          nxt=resolve(url,ref)
                          if nxt.startswith(WEB+"/assets/") and nxt not in seen:
                              pending.add(nxt)
          alljs=b"\n".join(corpus.values())
          print("Live JS asset count",len(corpus),"sample",sorted(corpus)[:10],flush=True)
          print("MoreChallenges assets",[u for u in corpus if "MoreChallenges" in u],flush=True)
          checks={
              "Random gallery action": b"Random game",
              "Personal stats tracking": b"History tracking starts now",
              "Session history labels": b"session",
              "More Challenges collection": b"Knowledge Arena",
              "Player summary endpoint": b"/api/game-modes/me/summary",
          }
          for name,marker in checks.items():
              found=marker in alljs
              print("Asset marker",name,":",found)
              if not found: raise AssertionError("Missing new MC-UX2 marker: "+name)
          print("Live MC-UX2 frontend assets verified; JS modules:",len(corpus),
                "total bytes:",len(alljs))
          PY
