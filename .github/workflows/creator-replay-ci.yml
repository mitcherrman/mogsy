name: creator-replay-frontend

on:
  pull_request:
    paths:
      - "src/pages/admin/CreatorReplayPage.tsx"
      - "src/pages/admin/CreatorReplayPage.test.tsx"
      - "src/pages/admin/CreatorReplayRunPage.test.tsx"
      - "src/pages/admin/CreatorReplayRunPage.tsx"
      - "src/App.tsx"
      - "src/lib/admin/admin-registry.ts"
      - ".github/workflows/creator-replay-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Baseline package-lock.json is already out of sync with package.json
      # (drizzle-kit / drizzle-orm / postgres added without lock refresh).
      # Do not modify the lockfile as part of this isolated feature PR.
      - name: Install dependency graph without changing the repository lockfile
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Creator Replay and admin registry tests
        run: npx vitest run src/pages/admin/CreatorReplayPage.test.tsx src/pages/admin/CreatorReplayRunPage.test.tsx src/pages/quiz-daily-challenge/run/DailyRunPage.test.tsx src/lib/admin/admin-registry.test.ts src/lib/admin/admin-registry.routes.test.ts
      - name: TypeScript check (guard all new errors; two unchanged baseline errors tracked)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.app.json > tsc.log 2>&1
          status=$?
          set -e
          cat tsc.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          mapfile -t failures < <(grep -E "error TS[0-9]+" tsc.log || true)
          if [ "${#failures[@]}" -eq 2 ] &&
             [[ "${failures[0]}" == src/components/onboarding/OnboardingProfile.tsx\(180,48\):\ error\ TS2345:* ]] &&
             [[ "${failures[1]}" == src/lib/identity/connections.ts\(263,13\):\ error\ TS2345:* ]]; then
            echo "::warning::Existing unchanged Supabase typing baseline: onboarding and identity; no new TypeScript errors"
          else
            echo "::error::TypeScript errors beyond the two verified unchanged baseline errors"
            exit 1
          fi
      - name: Vite production bundle
        run: npx vite build
