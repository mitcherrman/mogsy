name: combat-estimate-public

# CE-FIX1 — Combat Estimate opened from More Challenges must not shrink away.
# Six hits to the results at 390x844, 360x640, 1280x720 and 1440x900, with
# collapse, disappearing-stage and navigation checks. Bundled Chromium on the
# GitHub runner, one worker (AGENTS.md).
on:
  push:
    branches:
      - "fix/combat-estimate-**"
  pull_request:
    paths:
      - "src/components/combat-estimate/**"
      - "src/components/interaction-grammar/**"
      - "src/components/ranked-arena/**"
      - "src/pages/quiz-more-challenges/**"
      - "src/pages/admin/playtests/ownerArena.tsx"
      - "src/lib/combat-estimate/**"
      - "src/lib/public-modes/**"
      - "src/index.css"
      - "e2e/combat-estimate-public/**"
      - "playwright.combat-estimate-public.config.ts"
      - ".github/workflows/combat-estimate-public.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-route-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Combat Estimate public route
        shell: bash
        run: |
          mkdir -p test-results/combat-estimate-public
          set -o pipefail
          npx playwright test -c playwright.combat-estimate-public.config.ts --workers=1 2>&1 | tee test-results/combat-estimate-public/run.log
      - name: Upload screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-estimate-public-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: >-
          npx vitest run
          src/pages/quiz-more-challenges
          src/pages/admin/numeric-lab
          src/components/interaction-grammar/EstimateBeam.test.tsx
          src/lib/public-modes
      - name: Production build
        run: npx vite build
