name: ranked-beta-live-browser
on:
  pull_request:
    paths:
      - "scripts/ci/ranked-beta-live-smoke.mjs"
      - ".github/workflows/ranked-beta-live-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci/ranked-beta-live-smoke.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranked-beta-live-browser-evidence
          path: test-results/ranked-beta-live/
          if-no-files-found: warn
