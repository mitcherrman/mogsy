name: Signup Moments V1 Acceptance

on:
  pull_request:
    paths:
      - 'src/pages/quiz-daily-challenge/run/DailyCompletion*'
      - 'src/pages/quiz-daily-challenge/run/DailyRunPage.test.tsx'
      - 'src/pages/quiz-daily-challenge/run/dailyV2P0.compat.test.tsx'
      - 'src/pages/quiz-daily-challenge/run/dailyV2P2A.hierarchy.test.tsx'
      - 'src/pages/Quiz.tsx'
      - 'src/components/quiz/QuizSignUpNudge*'
      - 'src/lib/quiz/onboarding-gate.ts'
      - 'src/test/onboarding-gate.test.ts'
      - 'src/lib/analytics/contract.ts'
      - 'e2e/signup-moments/**'
      - '.github/workflows/signup-moments-v1.yml'

permissions:
  contents: read

jobs:
  signup-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused signup and Daily regression tests
        run: npm test -- src/components/quiz/QuizSignUpNudge.test.tsx src/components/quiz/QuizSignUpGate.test.tsx src/pages/quiz-daily-challenge/run/DailyCompletion.signup.test.tsx src/pages/quiz-daily-challenge/run/DailyRunPage.test.tsx src/pages/quiz-daily-challenge/run/dailyV2P0.compat.test.tsx src/pages/quiz-daily-challenge/run/dailyV2P2A.hierarchy.test.tsx src/test/onboarding-gate.test.ts
      - name: Production compilation
        run: npx vite build
      - name: Check for new TypeScript diagnostics relative to main
        run: |
          git fetch --no-tags --depth=1 origin main
          node scripts/ci/check-audience-typecheck.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Daily recap mobile/desktop acceptance
        run: npx playwright test -c playwright.signup-moments.config.ts
