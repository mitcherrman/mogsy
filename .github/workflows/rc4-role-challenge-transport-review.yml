name: rc4-role-challenge-transport-review

on:
  pull_request:
    paths:
      - "src/lib/role-challenge/**"
      - ".github/workflows/rc4-role-challenge-transport-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-challenge-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Known base-repo blocker: package-lock.json omits package.json's
      # drizzle-kit / drizzle-orm / postgres tree, so npm ci fails before
      # reaching any RC4 tests. This is a DIAGNOSTIC install only, not
      # reproducible release validation. Restore npm ci before merging RC4.
      - name: Install dependencies (diagnostic; base lockfile out of sync)
        run: npm install --package-lock=false --no-save --no-audit --no-fund
      - name: Run RC4 transport contract tests
        run: npx vitest run src/lib/role-challenge/contracts.test.ts
      - name: Typecheck the frontend
        run: npx tsc --project tsconfig.app.json --noEmit --pretty false
      - name: Ensure no tracked files changed
        run: test -z "$(git status --porcelain --untracked-files=no)"
