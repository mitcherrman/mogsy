name: rc4-role-challenge-transport-review

on:
  pull_request:
    paths:
      - "src/lib/role-challenge/**"
      - ".github/workflows/rc4-role-challenge-transport-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-challenge-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run RC4 transport contract tests
        run: npx vitest run src/lib/role-challenge/contracts.test.ts
      - name: Typecheck the frontend
        run: npx tsc --project tsconfig.app.json --noEmit --pretty false
      - name: Ensure no tracked files changed
        run: test -z "$(git status --porcelain --untracked-files=no)"
