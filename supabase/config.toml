project_id = "kewgjwrzpzpeltwidvuc"

[functions]
  [functions.admin-get-emails]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.check-subscription]
    verify_jwt = false
  [functions.create-checkout]
    verify_jwt = false
  [functions.customer-portal]
    verify_jwt = false
  # The provider OAuth redirect (Discord/Riot -> GET) carries no Supabase JWT,
  # so the gateway must not reject it. The function authenticates every action
  # that needs a Mogzy account itself, in requirePermanentUser.
  # Declared here so a repo-driven deploy reproduces the live callback
  # architecture instead of silently defaulting verify_jwt back to true.
  [functions.identity-link]
    verify_jwt = false
  [functions.populate-preset-images]
    verify_jwt = false
  # FUNNEL1B3.1 — Railway's authoritative gameplay ingest. The caller is a
  # server with no Supabase session, so the gateway must not demand a user JWT;
  # the function authenticates itself against RAILWAY_ANALYTICS_INGEST_SECRET
  # before it reads anything else. Declared here so a repo-driven deploy
  # reproduces that rather than silently defaulting verify_jwt back to true and
  # breaking every gameplay event with a 401.
  [functions.railway-analytics-ingest]
    verify_jwt = false
  [functions.purge-anonymous-users]
    verify_jwt = false
  [functions.snapshot-global-elo]
    verify_jwt = false
  [functions.stripe-webhook]
    verify_jwt = false
  [functions.verify-gift]
    verify_jwt = true
