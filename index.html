    <!-- Non-render-blocking font loading via JS injection -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" />

    </noscript>
    <script>
      // Load fonts asynchronously — media="print" trick prevents render-blocking
      (function() {
        var fonts = [
          'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap',
          'https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap',
          'https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap'
        ];
        fonts.forEach(function(href) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = href;
          link.media = 'print';
          link.onload = function() { this.media = 'all'; };
          document.head.appendChild(link);
        });
      })();
    </script>
    <style>
      /* Static startup shell: a flat rectangle of the destination route's base
         colour, and nothing else. It sits BEHIND the app (z-index:-1) so it can
         never cover mounted React content, even if its removal is delayed.

         Deliberately no gradient, texture or shape. Anything drawn here is a
         layer the real page then has to replace, which the visitor reads as the
         page being built in front of them. A flat colour has nothing to notice. */
      #initial-shell {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: #0a0a1a;
      }
      html[data-startup-shell="lol"] #initial-shell { background: #060c14; }
      html[data-startup-shell="entry"] #initial-shell { background: #04070f; }
    </style>
  </head>

  <body style="background:#0a0a1a">
    <script>
      // Pre-paint bootstrap. Purely visual: it chooses a base colour and the
      // route's theme class so the first frame the browser paints is already the
      // right surface. It reads no user data and makes no security decisions.
      // Colours mirror src/lib/startup-shell.ts (enforced by a contract test).
      (function() {
        var d = document.documentElement;
        try {
          if (localStorage.getItem('mogsy-reduce-motion') === '1') d.classList.add('reduce-motion');
          if (localStorage.getItem('mogsy-large-text') === '1') d.classList.add('large-text');
          if (localStorage.getItem('mogsy-high-contrast') === '1') d.classList.add('high-contrast');
        } catch (e) {}

        try {
          var p = window.location.pathname;
          var isLol =
            p === '/lol' || p.indexOf('/lol/') === 0 ||
            p === '/combat-lab' || p.indexOf('/combat-lab/') === 0 ||
            p === '/quiz' || p.indexOf('/quiz/') === 0;
          var isEntry = p === '/' || p === '/dev/mogzy-entry-v2';

          var variant = isLol ? 'lol' : (isEntry ? 'entry' : 'default');
          var bg = isLol ? '#060c14' : (isEntry ? '#04070f' : '#0a0a1a');

          // The League section owns its palette; applying it here means a direct
          // hit on /lol never paints a frame in the general dark theme. Every
          // other route is left alone so the sitewide theme provider still owns it.
          if (isLol) {
            d.classList.add('dark');
            d.classList.add('theme-lol');
          }

          // Set on <html> rather than the shell element so the choice is made
          // before #initial-shell has even been parsed.
          d.setAttribute('data-startup-shell', variant);
          document.body.style.background = bg;
        } catch (e) {}
      })();
    </script>
    <!-- Startup shell — lives OUTSIDE #root so React's first commit doesn't
         destroy it, and behind it so it cannot mask the mounted app. -->
    <div id="initial-shell" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- AdSense script is loaded dynamically by AdBanner component with the configured client ID -->
  </body>
